```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nopkiri Livery Shop</title>

<style>
*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
  min-height:100vh;
  overflow-x:hidden;

  background:
    radial-gradient(circle at 50% -10%,#173b55 0,#0a1220 35%,#03050a 75%);
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:-1;

  background:
    radial-gradient(circle at 15% 20%,rgba(0,229,255,.14),transparent 25%),
    radial-gradient(circle at 85% 35%,rgba(124,77,255,.13),transparent 25%),
    radial-gradient(circle at 50% 90%,rgba(255,47,146,.10),transparent 30%);

  animation:backgroundGlow 6s ease-in-out infinite alternate;
}

@keyframes backgroundGlow{
  from{
    opacity:.55;
    transform:scale(1);
  }

  to{
    opacity:1;
    transform:scale(1.08);
  }
}


/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:100;

  background:rgba(3,6,14,.82);
  backdrop-filter:blur(18px);

  border-bottom:1px solid rgba(0,229,255,.45);

  box-shadow:
    0 0 12px rgba(0,229,255,.25),
    0 0 35px rgba(0,229,255,.10);
}

.nav{
  max-width:1200px;
  min-height:76px;
  margin:auto;
  padding:12px 18px;

  display:flex;
  align-items:center;
  gap:18px;
}

.logo{
  font-size:21px;
  font-weight:900;
  color:#00e5ff;
  white-space:nowrap;

  text-shadow:
    0 0 5px #00e5ff,
    0 0 15px rgba(0,229,255,.8),
    0 0 30px rgba(0,229,255,.45);
}

.logo span{
  display:block;
  margin-top:3px;

  font-size:9px;
  letter-spacing:2px;
  color:#9aa9c7;
}

.title{
  flex:1;
  text-align:center;

  font-size:17px;
  font-weight:800;
  color:#e8f8ff;

  text-shadow:
    0 0 6px rgba(255,255,255,.6),
    0 0 15px rgba(0,229,255,.45);
}

.cart{
  font-size:27px;
  cursor:pointer;

  filter:
    drop-shadow(0 0 5px #00e5ff)
    drop-shadow(0 0 12px rgba(0,229,255,.7));

  transition:.25s;
}

.cart:hover{
  transform:scale(1.2);
}

.menu{
  font-size:27px;
  color:#00e5ff;

  text-shadow:
    0 0 6px #00e5ff,
    0 0 15px #00e5ff;
}


/* HERO */

.hero{
  max-width:1000px;
  margin:auto;
  padding:75px 18px 40px;

  text-align:center;
}

.tag{
  display:inline-block;

  padding:9px 17px;

  border:1px solid #00e5ff;
  border-radius:30px;

  color:#00e5ff;
  background:rgba(0,229,255,.05);

  font-size:12px;
  font-weight:900;
  letter-spacing:2px;

  box-shadow:
    0 0 8px rgba(0,229,255,.7),
    inset 0 0 10px rgba(0,229,255,.1);

  animation:tagGlow 2s ease-in-out infinite alternate;
}

@keyframes tagGlow{
  from{
    box-shadow:
      0 0 5px rgba(0,229,255,.5),
      inset 0 0 5px rgba(0,229,255,.1);
  }

  to{
    box-shadow:
      0 0 18px rgba(0,229,255,.9),
      inset 0 0 12px rgba(0,229,255,.2);
  }
}

.hero h1{
  margin:25px 0 0;

  font-size:clamp(40px,8vw,70px);
  line-height:1;
  font-weight:1000;

  background:
    linear-gradient(
      90deg,
      #00e5ff,
      #7c4dff,
      #ff2f92,
      #00e5ff
    );

  background-size:300% 100%;

  -webkit-background-clip:text;
  background-clip:text;

  color:transparent;

  animation:titleGradient 5s linear infinite;

  filter:
    drop-shadow(0 0 8px rgba(0,229,255,.35));
}

@keyframes titleGradient{
  0%{
    background-position:0% 50%;
  }

  100%{
    background-position:300% 50%;
  }
}

.hero p{
  max-width:700px;
  margin:23px auto 0;

  color:#a6b5d0;
  font-size:18px;
  line-height:1.6;

  text-shadow:
    0 0 8px rgba(0,229,255,.2);
}


/* SEARCH */

.controls{
  max-width:1100px;
  margin:20px auto 30px;

  padding:0 18px;

  display:flex;
  gap:14px;
}

input,
select{
  width:100%;

  padding:17px 18px;

  border-radius:15px;

  border:1px solid #28425c;

  background:rgba(7,13,25,.88);

  color:#fff;

  font-size:16px;

  outline:none;

  box-shadow:
    0 0 8px rgba(0,229,255,.08),
    inset 0 0 12px rgba(0,229,255,.04);

  transition:.3s;
}

input::placeholder{
  color:#687a98;
}

input:focus,
select:focus{
  border-color:#00e5ff;

  box-shadow:
    0 0 8px #00e5ff,
    0 0 20px rgba(0,229,255,.35),
    inset 0 0 12px rgba(0,229,255,.08);
}


/* PRODUCTS */

.grid{
  max-width:1100px;
  margin:auto;

  padding:10px 18px 70px;

  display:grid;

  grid-template-columns:
    repeat(auto-fit,minmax(270px,1fr));

  gap:24px;
}


/* CARD */

.card{
  position:relative;
  overflow:hidden;

  padding:12px;

  border-radius:20px;

  border:1px solid #263c57;

  background:
    linear-gradient(
      145deg,
      rgba(18,29,50,.96),
      rgba(5,9,18,.97)
    );

  box-shadow:
    0 10px 30px rgba(0,0,0,.45),
    0 0 8px rgba(0,229,255,.08);

  transition:
    transform .3s,
    border-color .3s,
    box-shadow .3s;
}

.card::before{
  content:"";

  position:absolute;

  width:180px;
  height:180px;

  top:-100px;
  right:-100px;

  background:#00e5ff;

  filter:blur(75px);

  opacity:.15;

  transition:.3s;
}

.card::after{
  content:"";

  position:absolute;

  width:120px;
  height:120px;

  bottom:-80px;
  left:-70px;

  background:#ff2f92;

  filter:blur(65px);

  opacity:.10;
}

.card:hover{
  transform:
    translateY(-8px)
    scale(1.015);

  border-color:#00e5ff;

  box-shadow:
    0 15px 40px rgba(0,0,0,.55),
    0 0 8px #00e5ff,
    0 0 25px rgba(0,229,255,.35),
    0 0 50px rgba(124,77,255,.15);
}

.card:hover::before{
  opacity:.35;
}

.card img,
.imgbox > div{
  width:100%;
  height:210px;

  object-fit:cover;

  border-radius:15px;

  background:#0b1322;

  border:1px solid #253852;

  box-shadow:
    0 0 8px rgba(0,229,255,.12);

  transition:.3s;
}

.card:hover img{
  border-color:#00e5ff;

  box-shadow:
    0 0 8px #00e5ff,
    0 0 20px rgba(0,229,255,.25);
}

.card h2{
  margin:17px 5px 8px;

  font-size:19px;
  line-height:1.3;

  color:#f1f8ff;

  text-shadow:
    0 0 7px rgba(255,255,255,.18);
}

.price{
  margin:8px 5px 17px;

  font-size:28px;
  font-weight:900;

  color:#00e5ff;

  text-shadow:
    0 0 5px #00e5ff,
    0 0 15px rgba(0,229,255,.55);
}


/* TELEGRAM BUTTON */

button{
  position:relative;

  width:100%;

  border:1px solid #00e5ff;

  border-radius:13px;

  padding:15px;

  cursor:pointer;

  color:#021016;

  background:
    linear-gradient(
      90deg,
      #00e5ff,
      #19f5b5
    );

  font-size:16px;
  font-weight:900;

  box-shadow:
    0 0 7px rgba(0,229,255,.7),
    0 0 20px rgba(0,229,255,.2);

  transition:.25s;

  overflow:hidden;
}

button::before{
  content:"";

  position:absolute;

  top:0;
  left:-120%;

  width:70%;
  height:100%;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.7),
      transparent
    );

  transform:skewX(-20deg);

  transition:.5s;
}

button:hover::before{
  left:150%;
}

button:hover{
  transform:translateY(-3px);

  box-shadow:
    0 0 10px #00e5ff,
    0 0 25px rgba(0,229,255,.55),
    0 0 45px rgba(25,245,181,.25);
}

button:active{
  transform:scale(.97);
}


/* FOOTER */

footer{
  padding:30px 18px;

  text-align:center;

  color:#697996;

  border-top:1px solid #1e334b;

  background:#03060b;

  box-shadow:
    0 -5px 25px rgba(0,229,255,.06);
}

footer strong{
  color:#00e5ff;

  text-shadow:
    0 0 6px #00e5ff;
}


/* MOBILE */

@media(max-width:650px){

  .nav{
    min-height:70px;
    padding:10px 12px;
    gap:10px;
  }

  .logo{
    font-size:16px;
  }

  .logo span{
    font-size:7px;
    letter-spacing:1px;
  }

  .title{
    display:none;
  }

  .menu{
    font-size:23px;
  }

  .hero{
    padding-top:55px;
  }

  .hero h1{
    font-size:44px;
  }

  .hero p{
    font-size:16px;
  }

  .controls{
    flex-direction:column;
  }

  .grid{
    grid-template-columns:1fr;
  }

}
</style>
</head>


<body>


<header>

  <div class="nav">

    <div class="logo">

      NOPKIRI LIVERY SHOP

      <span>
        CREATIVE GAME VEHICLES
      </span>

    </div>


    <div class="title">
      GAMING LIVERY MARKET
    </div>


    <div class="cart">
      💙
    </div>


    <div class="menu">
      ☰
    </div>

  </div>

</header>



<section class="hero">

  <div class="tag">
    ⚡ PREMIUM GAMING LIVERY
  </div>


  <h1>
    GAME VEHICLES<br>
    &amp; LIVERY
  </h1>


  <p>
    Discover premium vehicle liveries and creative
    racing designs for your favorite games.
  </p>

</section>



<div class="controls">

  <input
    id="search"
    placeholder="🔍 Search vehicles..."
    oninput="renderProducts()"
  >


  <select
    id="sort"
    onchange="renderProducts()"
  >

    <option value="default">
      ⚡ Sort Products
    </option>

    <option value="low">
      💰 Price: Low to High
    </option>

    <option value="high">
      💎 Price: High to Low
    </option>

  </select>

</div>



<main
  class="grid"
  id="products"
></main>



<footer>

  © 2026

  <strong>
    Nopkiri Livery Shop
  </strong>

  · Gaming Livery Store

</footer>



<script>

const products = [

  {
    name:"Mercedes AMG GT3 Racing",
    price:1.50,
    image:"mercedes_amg_gt3.png"
  },

  {
    name:"Ford Mustang Formula Drift",
    price:2.00,
    image:"ford_mustang_formula_drift.png"
  },

  {
    name:"Audi R8 GT3 Racing",
    price:1.60,
    image:"audi_r8_gt3_racing.png"
  }

];


function money(n){

  return "$" + n.toFixed(2);

}


function renderProducts(){

  let list = [...products];


  const q =
    document
      .getElementById("search")
      .value
      .toLowerCase();


  const sort =
    document
      .getElementById("sort")
      .value;


  list =
    list.filter(p =>
      p.name
       .toLowerCase()
       .includes(q)
    );


  if(sort === "low"){

    list.sort(
      (a,b) =>
        a.price - b.price
    );

  }


  if(sort === "high"){

    list.sort(
      (a,b) =>
        b.price - a.price
    );

  }


  document
    .getElementById("products")
    .innerHTML =

    list.map(p => `

      <article class="card">


        <div class="imgbox">

          ${
            p.image

            ?

            `<img
              src="${p.image}"
              alt="${p.name}"
            >`

            :

            `<div
              style="
                display:flex;
                align-items:center;
                justify-content:center;
                font-size:64px;
              "
            >
              🚗
            </div>`
          }

        </div>


        <h2>
          ${p.name}
        </h2>


        <div class="price">
          ${money(p.price)}
        </div>


        <button
          onclick="
            payViaTelegram(
              ${products.indexOf(p)}
            )
          "
        >
          💙 PAY VIA TELEGRAM
        </button>


      </article>

    `).join("");

}



function payViaTelegram(i){

  const product =
    products[i];


  const message =
    "Hello, I want to buy: " +
    product.name +
    " - " +
    money(product.price);


  const telegramURL =
    "https://t.me/nopkiri168?text=" +
    encodeURIComponent(message);


  window.location.href =
    telegramURL;

}



renderProducts();

</script>


</body>
</html>
```
